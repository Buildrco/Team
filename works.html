<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b2d">
  <title>Our Works — Nook Studios</title>
  <style>
    @font-face{font-family:AntonLocal;src:url("./fonts.gstatic.com/s/anton/v27/TEuZM9muUU23.woff2") format("woff2");font-display:swap}
    :root{--navy:#071b2d;--ink:#101010;--paper:#faf9f6;--yellow:#e8e25c;--pink:#f2c3d4;--green:#c8fd83;--muted:#6f746f}
    *{box-sizing:border-box}html{background:var(--paper);scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif}button,a{font:inherit}button{cursor:pointer}
    .works-nav{animation:heroFade .65s both;align-items:center;background:var(--navy);display:flex;justify-content:space-between;padding:28px clamp(22px,5vw,80px);position:absolute;top:0;width:100%;z-index:5}.works-logo{height:auto;object-fit:contain;width:68px}.works-menu{align-items:center;background:#fff;border:0;display:flex;height:58px;justify-content:center;width:58px}.works-menu i,.works-menu i:before,.works-menu i:after{background:var(--ink);content:"";display:block;height:2px;position:relative;width:27px}.works-menu i:before{position:absolute;top:-8px}.works-menu i:after{position:absolute;top:8px}
    .works-hero{background:var(--navy);color:#fff;min-height:clamp(620px,88vh,900px);overflow:hidden;padding:clamp(145px,18vh,210px) clamp(24px,7vw,110px) 90px;position:relative;text-align:center}.hero-art{animation:heroArtIn .8s .3s both;object-fit:contain;pointer-events:none;position:absolute;width:92px;z-index:0}.hero-art-left{left:-24px;top:clamp(135px,19vh,220px);transform:rotate(-12deg)}.hero-art-right{right:-18px;top:clamp(135px,19vh,220px);width:88px}.works-kicker{animation:heroKicker .7s .15s both;position:relative;z-index:1}.mobile-hero-title{display:none}.works-kicker{color:var(--yellow);font-size:clamp(18px,2.2vw,30px);font-weight:700;letter-spacing:.02em;margin:0 0 28px;text-transform:uppercase}.works-hero h1{animation:heroText .9s .25s both;font-family:AntonLocal,Impact,sans-serif;position:relative;z-index:1;font-size:clamp(48px,8.2vw,128px);font-weight:400;letter-spacing:-.035em;line-height:1.08;margin:0 auto;max-width:1180px;text-transform:uppercase}.works-hero h1 span{color:#fff}.works-hero h1 em{color:var(--pink);font-style:normal}.works-hero h1 strong{color:var(--green);font-weight:400}.works-scroll{bottom:27px;color:rgba(255,255,255,.6);font-size:11px;left:0;letter-spacing:.16em;position:absolute;right:0;text-transform:uppercase}.works-scroll:after{animation:scrollDot 1.5s ease-in-out infinite;background:var(--yellow);border-radius:50%;content:"";display:block;height:6px;margin:12px auto 0;width:6px}
    .works-gallery-section{background:var(--paper);padding:clamp(44px,8vw,100px) clamp(16px,5vw,80px) 100px}.works-gallery-heading{align-items:end;display:flex;gap:24px;justify-content:space-between;margin:0 auto 34px;max-width:1440px}.works-gallery-heading h2{font-family:AntonLocal,Impact,sans-serif;font-size:clamp(38px,6vw,78px);font-weight:400;letter-spacing:-.04em;line-height:.9;margin:0;text-transform:uppercase}.works-gallery-heading p{color:var(--muted);font-size:14px;line-height:1.45;margin:0;max-width:250px}.works-grid{column-count:2;column-gap:clamp(12px,2.4vw,28px);margin:0 auto;max-width:1440px}.pin-card{background:none;border:0;break-inside:avoid;display:block;margin:0 0 clamp(18px,3vw,36px);padding:0;text-align:left;width:100%;animation:pinRise .75s both;animation-delay:calc(var(--delay)*90ms)}.pin-media{background:#e9e7e1;border-radius:12px;display:block;overflow:hidden;position:relative}.pin-media img{display:block;height:auto;transition:transform .55s cubic-bezier(.2,.7,.2,1);width:100%}.pin-card:hover .pin-media img{transform:scale(1.035)}.pin-hover{align-items:center;background:rgba(7,27,45,.9);border-radius:999px;color:#fff;display:flex;font-size:12px;font-weight:700;gap:12px;left:14px;opacity:0;padding:10px 14px;position:absolute;top:14px;transform:translateY(6px);transition:.25s ease}.pin-card:hover .pin-hover,.pin-card:focus-visible .pin-hover{opacity:1;transform:none}.pin-arrow{font-size:18px}.pin-copy{align-items:baseline;display:flex;gap:12px;justify-content:space-between;padding:11px 2px 0}.pin-copy strong{font-size:14px;letter-spacing:-.025em}.pin-copy small{color:var(--muted);font-size:11px;text-align:right}
    .viewer[hidden]{display:none}.viewer{inset:0;position:fixed;z-index:20}.viewer-backdrop{background:rgba(7,27,45,.82);inset:0;position:absolute}.viewer-dialog{background:var(--paper);border-radius:18px;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(300px,.92fr);left:50%;max-height:calc(100vh - 36px);max-width:1080px;overflow:auto;position:absolute;top:50%;transform:translate(-50%,-50%);width:calc(100% - 36px);animation:viewerIn .3s ease}.viewer-dialog>img{background:#eceae5;display:block;height:100%;max-height:78vh;min-height:420px;object-fit:cover;width:100%}.viewer-info{padding:38px 30px}.viewer-info small{color:#b4a60e;font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.viewer-info h2{font-family:AntonLocal,Impact,sans-serif;font-size:clamp(42px,5vw,70px);font-weight:400;letter-spacing:-.04em;line-height:.9;margin:16px 0}.viewer-info p{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 28px}.viewer-close{align-items:center;background:#fff;border:0;border-radius:50%;display:flex;font-size:25px;height:38px;justify-content:center;position:absolute;right:14px;top:14px;width:38px;z-index:2}.suggested{border-top:1px solid #e2e1db;padding-top:18px}.suggested h3{font-size:17px;letter-spacing:-.04em;margin:0 0 13px}.suggested-grid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}.suggested-card{background:none;border:0;padding:0;text-align:left}.suggested-card img{border-radius:8px;display:block;height:94px;object-fit:cover;width:100%}.suggested-card span{color:var(--muted);display:block;font-size:11px;margin-top:6px}.viewer-open{overflow:hidden}
    @keyframes heroFade{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}@keyframes heroKicker{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes heroText{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}@keyframes heroArtIn{from{opacity:0;transform:translateY(20px) scale(.8) rotate(-18deg)}to{opacity:1;transform:translateY(0) scale(1) rotate(-12deg)}}@keyframes pinRise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes scrollDot{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(8px);opacity:1}}@keyframes viewerIn{from{opacity:0;transform:translate(-50%,-47%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
    @media(max-width:700px){.works-nav{padding:22px 20px}.works-logo{width:66px}.works-menu{height:56px;width:58px}.works-hero{min-height:650px;padding:155px 22px 90px}.works-hero h1{font-size:clamp(42px,10.2vw,64px);line-height:1.1}.hero-art{width:82px}.hero-art-left{left:-24px;top:145px}.hero-art-right{right:-18px;top:142px;width:80px}.works-kicker{font-size:19px}.desktop-hero-title{display:none}.mobile-hero-title{display:block}.works-gallery-section{padding:45px 14px 80px}.works-gallery-heading{align-items:start;display:block;margin-bottom:25px}.works-gallery-heading h2{font-size:53px;margin-bottom:12px}.works-gallery-heading p{max-width:270px}.works-grid{column-count:2;column-gap:10px}.pin-card{margin-bottom:19px}.pin-copy{display:block}.pin-copy small{display:block;margin-top:4px;text-align:left}.viewer-dialog{display:block;max-height:calc(100vh - 16px);width:calc(100% - 16px)}.viewer-dialog>img{max-height:42vh;min-height:0}.viewer-info{padding:26px 20px 22px}.viewer-info h2{font-size:52px}.suggested-card img{height:100px}}
  </style>
</head>
<body>
  <header class="works-nav"><a href="/" aria-label="Back to Nook Studios"><img class="works-logo" src="./nook-studios-logo.png" alt="Nook Studios"></a><button class="works-menu" type="button" aria-label="Menu"><i></i></button></header>
  <main>
    <section class="works-hero">
      <img class="hero-art hero-art-left" src="./framerusercontent.com/images/zyTzV8RZHHRnGZlc4e1gdVonA_scale-down-to%3D512%26width%3D3000%26height%3D3000.png" alt="" aria-hidden="true">
      <img class="hero-art hero-art-right" src="./framerusercontent.com/images/8TU75zSjir3LVlOupK2d73uw58_width%3D224%26height%3D224.png" alt="" aria-hidden="true">
      <p class="works-kicker">Our work</p>
      <h1 class="desktop-hero-title"><span>With a combined</span> <em>years of experience,</em> <span>our team is passionate about helping</span> <strong>businesses grow.</strong></h1>
      <h1 class="mobile-hero-title"><span>With a combined </span><em>years</em><br><em>of experience,</em> <span>our</span><br><span>team is passionate</span><br><span>about helping</span><br><strong>businesses grow.</strong></h1>
      <div class="works-scroll">Scroll to explore</div>
    </section>
    <section class="works-gallery-section" aria-labelledby="works-gallery-title">
      <div class="works-gallery-heading"><h2 id="works-gallery-title">Selected works</h2><p>Ideas, identities, and digital worlds made to stay with you.</p></div>
      <div class="works-grid">
        <button class="pin-card" type="button" data-title="Bajindu" style="--delay:0"><span class="pin-media"><img src="./framerusercontent.com/images/4ELvfGisLwg2bivRpvymFikUY_scale-down-to%3D1024%26width%3D1584%26height%3D972.png" alt="Bajindu project"><span class="pin-hover">View project <b class="pin-arrow">↗</b></span></span><span class="pin-copy"><strong>Bajindu</strong><small>Brand identity</small></span></button>
        <button class="pin-card" type="button" data-title="Pump" style="--delay:1"><span class="pin-media"><img src="./framerusercontent.com/images/c6quDVvua9PzowsUI2FTZqHHo24_scale-down-to%3D1024%26width%3D1300%26height%3D1600.png" alt="Pump project"><span class="pin-hover">View project <b class="pin-arrow">↗</b></span></span><span class="pin-copy"><strong>Pump</strong><small>Product launch</small></span></button>
        <button class="pin-card" type="button" data-title="Canne" style="--delay:2"><span class="pin-media"><img src="./framerusercontent.com/images/OfDyPQ9wcOv5yizqmGGiw9p9o_scale-down-to%3D1024%26width%3D1584%26height%3D972.png" alt="Canne project"><span class="pin-hover">View project <b class="pin-arrow">↗</b></span></span><span class="pin-copy"><strong>Canne</strong><small>Campaign art</small></span></button>
        <button class="pin-card" type="button" data-title="Absolute.308" style="--delay:3"><span class="pin-media"><img src="./framerusercontent.com/images/Qhci2BrqufhycMHG3nlAqebgns4_scale-down-to%3D1024%26width%3D1440%26height%3D1000.png" alt="Absolute.308 project"><span class="pin-hover">View project <b class="pin-arrow">↗</b></span></span><span class="pin-copy"><strong>Absolute.308</strong><small>Visual system</small></span></button>
        <button class="pin-card" type="button" data-title="Nook Studios" style="--delay:4"><span class="pin-media"><img src="./framerusercontent.com/images/m1QolqibGeJtHxap3FSDYwh2ivw_scale-down-to%3D1024%26width%3D1320%26height%3D1650.png" alt="Nook Studios project"><span class="pin-hover">View project <b class="pin-arrow">↗</b></span></span><span class="pin-copy"><strong>Nook Studios</strong><small>Digital experience</small></span></button>
        <button class="pin-card" type="button" data-title="Afi" style="--delay:5"><span class="pin-media"><img src="./framerusercontent.com/images/sHDqYlrZP0VFOdBhKFh6QbWUoL8_scale-down-to%3D1024%26width%3D1320%26height%3D1650.png" alt="Afi project"><span class="pin-hover">View project <b class="pin-arrow">↗</b></span></span><span class="pin-copy"><strong>Afi</strong><small>Campaign art</small></span></button>
        <button class="pin-card" type="button" data-title="Kora" style="--delay:6"><span class="pin-media"><img src="./framerusercontent.com/images/wi8NZYvAjIouKtG0fGU2wPK8gY_scale-down-to%3D1024%26width%3D1609%26height%3D1499.png" alt="Kora project"><span class="pin-hover">View project <b class="pin-arrow">↗</b></span></span><span class="pin-copy"><strong>Kora</strong><small>Digital experience</small></span></button>
        <button class="pin-card" type="button" data-title="Kente House" style="--delay:7"><span class="pin-media"><img src="./framerusercontent.com/images/tidtw9jROlXgTScfw5wbpXENcn8_scale-down-to%3D1024%26width%3D3000%26height%3D3000.png" alt="Kente House project"><span class="pin-hover">View project <b class="pin-arrow">↗</b></span></span><span class="pin-copy"><strong>Kente House</strong><small>Brand identity</small></span></button>
      </div>
    </section>
  </main>
  <div class="viewer" id="viewer" hidden></div>
  <script>
    const cards = [...document.querySelectorAll('.pin-card')];
    const viewer = document.getElementById('viewer');
    let active = 0;
    const openViewer = (index) => {
      active = index;
      const card = cards[active];
      const image = card.querySelector('img');
      const title = card.dataset.title;
      const suggestions = cards.map((item, itemIndex) => ({item, itemIndex})).filter(({itemIndex}) => itemIndex !== active).slice(0, 4);
      viewer.innerHTML = '<div class="viewer-backdrop" data-close="true"></div><div class="viewer-dialog" role="dialog" aria-modal="true"><button class="viewer-close" type="button" data-close="true" aria-label="Close">×</button><img src="' + image.currentSrc + '" alt="' + title + '"><div class="viewer-info"><small>Selected work</small><h2>' + title + '</h2><p>Explore this project from the Nook Studios works collection.</p><div class="suggested"><h3>More like this</h3><div class="suggested-grid">' + suggestions.map(({item, itemIndex}) => '<button class="suggested-card" type="button" data-suggest="' + itemIndex + '"><img src="' + item.querySelector('img').currentSrc + '" alt="' + item.dataset.title + '"><span>' + item.dataset.title + '</span></button>').join('') + '</div></div></div></div>';
      viewer.hidden = false;
      document.body.classList.add('viewer-open');
    };
    const closeViewer = () => { viewer.hidden = true; viewer.innerHTML = ''; document.body.classList.remove('viewer-open'); };
    cards.forEach((card, index) => card.addEventListener('click', () => openViewer(index)));
    viewer.addEventListener('click', (event) => { const close = event.target.closest('[data-close]'); if (close) closeViewer(); const suggestion = event.target.closest('[data-suggest]'); if (suggestion) openViewer(Number(suggestion.dataset.suggest)); });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeViewer(); });
  </script>
</body>
</html>
