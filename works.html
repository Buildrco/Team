<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071b2d">
    <title>Our Works — Nook Studios</title>
  </head>
  <body style="margin:0;background:#071b2d">
    <script>
      fetch('/index.html', { cache: 'no-store' })
        .then((response) => response.text())
        .then((html) => {
          const enhancer = '<script src="/site-overrides.js"><\/script>';
          const page = html.includes('</body>') ? html.replace('</body>', enhancer + '</body>') : html + enhancer;
          document.open();
          document.write(page);
          document.close();
        });
    </script>
  </body>
</html>
